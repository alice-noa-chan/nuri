[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuri"
version = "0.0.1"
description = "Bidirectional encoder with recurrent latent reasoning and masked refinement generation"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "safetensors>=0.4", "tokenizers>=0.19", "numpy>=1.26", "tqdm>=4.66"]

[project.optional-dependencies]
dev = ["pytest>=8", "transformers>=4.45"]
hf = ["transformers>=4.45"]
tensorboard = ["tensorboard>=2.16"]
flash2 = ["flash-attn>=2.6.3,<3"]
liger = ["liger-kernel>=0.6.4,<1"]

[tool.setuptools.packages.find]
include = ["nuri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
