[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nuri"
version = "0.0.1"
description = "Bidirectional encoder with recurrent latent reasoning and masked refinement generation"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "safetensors>=0.4", "tokenizers>=0.19", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["nuri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
